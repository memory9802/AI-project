  <script>
    (async () => {
      try {
        const res = await fetch('/login/status', { 
          method: 'GET',
          credentials: 'same-origin',
          headers: {
            'Accept': 'application/json'
          }
        });
        
        if (!res.ok) {
          console.error('Status check failed:', res.status);
          const nextUrl = encodeURIComponent(window.location.pathname + window.location.search);
          window.location.replace(`/login/?next=${nextUrl}`);
          return;
        }
        
        const data = await res.json();
        console.log('Login status:', data);
        
        if (!data.authenticated) {
          const nextUrl = encodeURIComponent(window.location.pathname + window.location.search);
          window.location.replace(`/login/?next=${nextUrl}`);
          return;
        }
        
        window.currentUser = data.user;
        const userDisplay = document.getElementById('user-display');
        if (userDisplay && data.user?.username) {
          userDisplay.textContent = data.user.username;
          userDisplay.classList.remove('hidden');
        }
      } catch (error) {
        console.error('Error checking login status:', error);
        const nextUrl = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.replace(`/login/?next=${nextUrl}`);
      }
    })();
  </script>

    <script>
      let currentPage = 0;
      let outfits = [];
      let totalPages = 0;

      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const shoppingBtn = document.getElementById("shopping-btn");
      const pageNumber = document.getElementById("page-number");
      const outfitSlides = document.getElementById("outfit-slides");
      const pageDotsContainer = document.querySelector(".flex.gap-2");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const chatHistory = document.getElementById("chat-history");

      function scrollToBottom() {
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      function addMessage(content, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'flex gap-4 items-start animate-fadeIn';
        
        if (isUser) {
          messageDiv.innerHTML = `
            <div class="flex-1"></div>
            <div class="flex-1 max-w-[80%]">
              <div class="bg-primary/10 dark:bg-primary/20 rounded-lg p-4 shadow-sm">
                <p class="text-sm leading-relaxed text-text-light dark:text-text-dark">${content}</p>
              </div>
            </div>
            <div class="flex-shrink-0 w-10 h-10 rounded-full bg-primary flex items-center justify-center">
              <span class="material-symbols-outlined text-white text-xl">person</span>
            </div>
          `;
        } else {
          messageDiv.innerHTML = `
            <div class="flex-shrink-0 w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center">
              <span class="material-symbols-outlined text-primary text-xl">smart_toy</span>
            </div>
            <div class="flex-1">
              <div class="bg-white dark:bg-secondary-dark rounded-lg p-4 shadow-sm">
                <p class="text-sm leading-relaxed text-text-light dark:text-text-dark">${content}</p>
              </div>
            </div>
          `;
        }
        
        chatHistory.appendChild(messageDiv);
        setTimeout(scrollToBottom, 100);
      }

      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) {
          addMessage("請先輸入您的需求。", false);
          return;
        }

        // 添加用戶訊息到聊天記錄
        addMessage(text, true);
        userInput.value = '';

        sendBtn.disabled = true;
        sendBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> 思考中...';

        try {
          // 先調用聊天 API 判斷意圖
          const chatRes = await fetch("{{ url_for('recommendation.chat_api') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });

          if (!chatRes.ok) {
            throw new Error(`聊天服務錯誤: ${chatRes.status}`);
          }
          
          const chatData = await chatRes.json();

          if (chatData.is_recommendation) {
            // 這是推薦需求，生成穿搭
            addMessage("正在為您產生個人化推薦，請稍候...", false);
            outfitSlides.innerHTML = '<div class="w-full h-full flex items-center justify-center text-subtle-light dark:text-subtle-dark"><span class="material-symbols-outlined animate-spin mr-2">progress_activity</span>載入中...</div>';
            if (pageDotsContainer) pageDotsContainer.innerHTML = '';

            const genRes = await fetch("{{ url_for('recommendation.generate_outfits_api') }}", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: text })
            });

            if (!genRes.ok) {
              const errorData = await genRes.json().catch(() => ({ error: '無法解析錯誤訊息' }));
              throw new Error(errorData.error || `伺服器錯誤: ${genRes.status}`);
            }
            
            const genData = await genRes.json();

            // 移除 "正在產生" 訊息（最後一個訊息）
            const lastMessage = chatHistory.lastElementChild;
            if (lastMessage) lastMessage.remove();

            if (genData.success && genData.data.length > 0) {
              outfits = genData.data;
              totalPages = outfits.length;
              addMessage(`為您生成了 ${totalPages} 套「${text}」主題穿搭！`, false);
              initOutfits();
            } else {
              outfits = [];
              totalPages = 0;
              addMessage(genData.error || "抱歉，無法根據您的需求生成有效的穿搭建議，請嘗試更換描述。", false);
              initOutfits();
            }
          } else {
            // 這是閒聊，顯示 AI 回應
            if (chatData.response) {
              addMessage(chatData.response, false);
            }
          }
        } catch (err) {
          // 移除可能存在的 "正在產生" 訊息
          const lastMessage = chatHistory.lastElementChild;
          if (lastMessage && lastMessage.textContent.includes('正在為您產生')) {
            lastMessage.remove();
          }
          
          addMessage(`🚨 發生錯誤：${err.message}`, false);
        } finally {
          sendBtn.disabled = false;
          sendBtn.innerHTML = '<span class="material-symbols-outlined text-lg">send</span><span class="hidden sm:inline">發送</span>';
        }
      }
      
      function createItemCard(item, category) {
        const defaultImage = 'https://via.placeholder.com/300x400.png?text=Image+Not+Found';
        const image = item && (item.image_url || item.image) ? (item.image_url || item.image) : defaultImage;
        const name = item ? item.name : '推薦單品';
        const color = item ? (item.color || '無顏色') : '';
        const brand = item ? (item.brand || '推薦品牌') : '';

        if (!item) {
          return `
            <div class="outfit-item">
              <div class="relative mb-3 border-2 border-dashed border-secondary-light dark:border-secondary-dark rounded-lg h-48 flex items-center justify-center">
                <div class="text-center text-subtle-light dark:text-subtle-dark">
                  <span class="material-symbols-outlined text-4xl mb-2 block opacity-30">checkroom</span>
                  <p class="text-xs">暫無${category}</p>
                </div>
              </div>
              <p class="text-xs text-subtle-light dark:text-subtle-dark text-center">可自由搭配</p>
            </div>
          `;
        }

        return `
          <div class="outfit-item">
            <div class="relative mb-3 group">
              <img src="${image}" alt="${name}" onerror="this.onerror=null;this.src='${defaultImage}';" class="w-full h-48 object-cover rounded-lg shadow-md" />
              <div class="absolute top-2 left-2 bg-primary text-white px-3 py-1 rounded-full text-xs font-medium">${category}</div>
            </div>
            <h3 class="font-bold text-sm mb-1">${name}</h3>
            <p class="text-xs text-subtle-light dark:text-subtle-dark mb-1">${color}</p>
            <p class="text-xs text-primary font-medium">${brand}</p>
          </div>
        `;
      }
      
      function createOutfitSlide(outfit) {
        const items = outfit.items || {};
        return `
          <div class="outfit-slide min-w-full h-full px-4">
            <div class="h-full bg-white dark:bg-secondary-dark rounded-xl shadow-lg overflow-hidden border border-secondary-light dark:border-secondary-dark">
              <div class="bg-gradient-to-r from-primary/20 to-primary/10 px-6 py-4">
                <div class="flex items-center justify-between">
                  <div>
                    <h2 class="text-2xl font-bold text-text-light dark:text-text-dark mb-1">${outfit.occasion}</h2>
                    <p class="text-sm text-subtle-light dark:text-subtle-dark">${outfit.description}</p>
                  </div>
                  <div class="flex items-center gap-2 bg-white dark:bg-secondary-dark px-4 py-2 rounded-full">
                    <span class="material-symbols-outlined text-primary">star</span>
                    <span class="font-bold text-lg">${outfit.score}%</span>
                  </div>
                </div>
              </div>
              <div class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4 h-[calc(100%-120px)] overflow-y-auto">
                ${createItemCard(items.top, '上衣')}
                ${createItemCard(items.bottom, '下身')}
                ${createItemCard(items.shoes, '鞋子')}
                ${createItemCard(items.accessories, '配件')}
              </div>
            </div>
          </div>
        `;
      }

      function updatePage() {
        if (!pageNumber) return;
        if (outfits.length === 0) {
            pageNumber.textContent = '0 / 0';
            prevBtn.classList.add('invisible');
            nextBtn.classList.add('hidden');
            shoppingBtn.classList.add('hidden');
            if (pageDotsContainer) pageDotsContainer.innerHTML = '';
            return;
        }

        outfitSlides.style.transform = `translateX(-${currentPage * 100}%)`;
        pageNumber.textContent = `${currentPage + 1} / ${totalPages}`;
        
        const pageDots = pageDotsContainer.querySelectorAll(".page-dot");
        pageDots.forEach((dot, index) => {
          dot.classList.toggle('bg-primary', index === currentPage);
          dot.classList.toggle('bg-subtle-light', index !== currentPage);
          dot.classList.toggle('dark:bg-subtle-dark', index !== currentPage);
        });

        prevBtn.disabled = currentPage === 0;
        prevBtn.classList.toggle('invisible', currentPage === 0);
        prevBtn.classList.toggle('flex', currentPage > 0);
        
        const isLastPage = currentPage === totalPages - 1;
        nextBtn.classList.toggle('hidden', isLastPage);
        shoppingBtn.classList.toggle('hidden', !isLastPage);
        shoppingBtn.classList.toggle('flex', isLastPage);
      }

      function initOutfits() {
        currentPage = 0;
        if (outfits && outfits.length > 0) {
            totalPages = outfits.length;
            let dotsHtml = '';
            for (let i = 0; i < totalPages; i++) {
                dotsHtml += `<div class="page-dot w-2 h-2 rounded-full ${i === 0 ? 'bg-primary' : 'bg-subtle-light dark:bg-subtle-dark'}"></div>`;
            }
            if (pageDotsContainer) pageDotsContainer.innerHTML = dotsHtml;

            outfitSlides.innerHTML = outfits.map(createOutfitSlide).join('');
        } else {
            totalPages = 0;
            if(pageDotsContainer) pageDotsContainer.innerHTML = '';
            outfitSlides.innerHTML = '<div class="text-center text-subtle-light dark:text-subtle-dark w-full p-10">請在上方輸入您的需求以開始生成穿搭建議。</div>';
        }
        updatePage();
      }

      sendBtn.addEventListener("click", sendMessage);
      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
        }
      });
      prevBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (currentPage > 0) {
          currentPage--;
          updatePage();
        }
      });
      nextBtn.addEventListener('click', (e) => {
        if (currentPage < totalPages - 1) {
          currentPage++;
          updatePage();
        }
      });
      shoppingBtn.addEventListener('click', (e) => {
        e.preventDefault();
        window.open("{{ url_for('wardrobe.deals') }}", '_blank', 'noopener,noreferrer');
      });
      document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft' && currentPage > 0) {
          currentPage--;
          updatePage();
        } else if (e.key === 'ArrowRight' && currentPage < totalPages - 1) {
          currentPage++;
          updatePage();
        }
      });

      window.addEventListener('load', () => {
        initOutfits();
      });
    </script>

    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 0.3s ease-in;
      }
    </style>
</body>
