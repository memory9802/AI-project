  <script>
    (async () => {
      try {
        const res = await fetch('/login/status', { credentials: 'same-origin' });
        const data = await res.json();
        if (!data.authenticated) {
          const nextUrl = encodeURIComponent(window.location.pathname + window.location.search);
          window.location.replace(`/login/?next=${nextUrl}`);
          return;
        }
        window.currentUser = data.user;
        const userDisplay = document.getElementById('user-display');
        if (userDisplay && data.user?.username) {
          userDisplay.textContent = data.user.username;
          userDisplay.classList.remove('hidden');
        }
      } catch (error) {
        window.location.replace('/login/');
      }
    })();
  </script>

    <script>
      let currentPage = 0;
      const totalPages = 3;
      const outfits = [];

      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const shoppingBtn = document.getElementById("shopping-btn");
      const pageNumber = document.getElementById("page-number");
      const outfitSlides = document.getElementById("outfit-slides");
      const pageDots = document.querySelectorAll(".page-dot");
      const aiMessage = document.getElementById("ai-message");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");

      // 生成或讀取 session ID（維持對話記憶）
      let sessionId = localStorage.getItem("outfit_ai_session");
      if (!sessionId) {
        sessionId = "user-" + Date.now() + "-" + Math.random().toString(36).substring(2, 9);
        localStorage.setItem("outfit_ai_session", sessionId);
      }

      // 發送訊息給AI
      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 顯示用戶訊息
        const userMessageHtml = `<p class="text-sm leading-relaxed text-text-light dark:text-text-dark mb-2"><strong>您：</strong>${text}</p>`;
        aiMessage.innerHTML += userMessageHtml;
        userInput.value = "";

        // 顯示載入中
        aiMessage.innerHTML += '<p class="text-sm leading-relaxed text-subtle-light dark:text-subtle-dark">AI正在思考中...</p>';

        try {
          const res = await fetch("/recommendation/recommend", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              session_id: sessionId,
              model: "auto"
            })
          });
          const data = await res.json();

          // 移除「思考中」訊息
          const messages = aiMessage.querySelectorAll('p');
          if (messages.length > 0) {
            messages[messages.length - 1].remove();
          }

          // 顯示AI回覆
          if (data.response) {
            const formattedResponse = data.response
              .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
              .replace(/\n/g, '<br>');
            aiMessage.innerHTML += `<p class="text-sm leading-relaxed text-text-light dark:text-text-dark mt-2"><strong>AI：</strong>${formattedResponse}</p>`;
          } else {
            aiMessage.innerHTML += '<p class="text-sm leading-relaxed text-red-500 mt-2">⚠️ 未收到AI回覆，請稍後再試</p>';
          }
        } catch (err) {
          // 移除「思考中」訊息
          const messages = aiMessage.querySelectorAll('p');
          if (messages.length > 0) {
            messages[messages.length - 1].remove();
          }
          aiMessage.innerHTML += `<p class="text-sm leading-relaxed text-red-500 mt-2">🚨 錯誤：${err.message}</p>`;
        }
      }

      // 事件監聽
      sendBtn.addEventListener("click", sendMessage);
      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      // 生成推薦數據（實際應該從後端API獲取）
      function generateOutfits() {
        return [
          {
            id: 1,
            occasion: '商務會議',
            description: '專業俐落的商務穿搭，展現自信與專業形象',
            score: 95,
            top: { name: '白色襯衫', image: 'https://images.unsplash.com/photo-1620799140188-3b2a7f3a5a7e?w=400', color: '白色', brand: 'UNIQLO' },
            bottom: { name: '黑色西裝褲', image: 'https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=400', color: '黑色', brand: 'ZARA' },
            shoes: { name: '黑色皮鞋', image: 'https://images.unsplash.com/photo-1533867617858-e7b97e060509?w=400', color: '黑色', brand: 'Clarks' },
            accessories: null
          },
          {
            id: 2,
            occasion: '週末約會',
            description: '輕鬆休閒的約會穿搭，展現親和力與時尚感',
            score: 88,
            top: { name: '卡其色T恤', image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400', color: '卡其', brand: 'H&M' },
            bottom: { name: '淺藍牛仔褲', image: 'https://images.unsplash.com/photo-1542272604-787c3835535d?w=400', color: '淺藍', brand: 'Levi\'s' },
            shoes: { name: '白色球鞋', image: 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400', color: '白色', brand: 'Nike' },
            accessories: { name: '棒球帽', image: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400', color: '黑色', brand: 'New Era' }
          },
          {
            id: 3,
            occasion: '日常出門',
            description: '簡約舒適的日常穿搭，溫暖百搭又實用',
            score: 92,
            top: { name: '深藍針織衫', image: 'https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=400', color: '深藍', brand: 'MUJI' },
            bottom: { name: '卡其色休閒褲', image: 'https://images.unsplash.com/photo-1506629082955-511b1aa562c8?w=400', color: '卡其', brand: 'GAP' },
            shoes: { name: '棕色休閒鞋', image: 'https://images.unsplash.com/photo-1603808033192-082d6919d3e1?w=400', color: '棕色', brand: 'Timberland' },
            accessories: null
          }
        ];
      }

      // 創建單套穿搭的HTML
      function createOutfitSlide(outfit, index) {
        return `
          <div class="outfit-slide min-w-full h-full px-4">
            <div class="h-full bg-white dark:bg-secondary-dark rounded-xl shadow-lg overflow-hidden border border-secondary-light dark:border-secondary-dark">
              <!-- Header -->
              <div class="bg-gradient-to-r from-primary/20 to-primary/10 px-6 py-4">
                <div class="flex items-center justify-between">
                  <div>
                    <h2 class="text-2xl font-bold text-text-light dark:text-text-dark mb-1">${outfit.occasion}</h2>
                    <p class="text-sm text-subtle-light dark:text-subtle-dark">${outfit.description}</p>
                  </div>
                  <div class="flex items-center gap-2 bg-white dark:bg-secondary-dark px-4 py-2 rounded-full">
                    <span class="material-symbols-outlined text-primary">star</span>
                    <span class="font-bold text-lg">${outfit.score}%</span>
                  </div>
                </div>
              </div>

              <!-- Outfit Items Grid -->
              <div class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4 h-[calc(100%-120px)] overflow-y-auto">
                <!-- Top -->
                <div class="outfit-item">
                  <div class="relative mb-3 group">
                    <img src="${outfit.top.image}" alt="${outfit.top.name}" 
                      class="w-full h-48 object-cover rounded-lg shadow-md" />
                    <div class="absolute top-2 left-2 bg-primary text-white px-3 py-1 rounded-full text-xs font-medium">
                      上衣
                    </div>
                  </div>
                  <h3 class="font-bold text-sm mb-1">${outfit.top.name}</h3>
                  <p class="text-xs text-subtle-light dark:text-subtle-dark mb-1">${outfit.top.color}</p>
                  <p class="text-xs text-primary font-medium">${outfit.top.brand}</p>
                </div>

                <!-- Bottom -->
                <div class="outfit-item">
                  <div class="relative mb-3 group">
                    <img src="${outfit.bottom.image}" alt="${outfit.bottom.name}" 
                      class="w-full h-48 object-cover rounded-lg shadow-md" />
                    <div class="absolute top-2 left-2 bg-primary text-white px-3 py-1 rounded-full text-xs font-medium">
                      下身
                    </div>
                  </div>
                  <h3 class="font-bold text-sm mb-1">${outfit.bottom.name}</h3>
                  <p class="text-xs text-subtle-light dark:text-subtle-dark mb-1">${outfit.bottom.color}</p>
                  <p class="text-xs text-primary font-medium">${outfit.bottom.brand}</p>
                </div>

                <!-- Shoes -->
                <div class="outfit-item">
                  <div class="relative mb-3 group">
                    <img src="${outfit.shoes.image}" alt="${outfit.shoes.name}" 
                      class="w-full h-48 object-cover rounded-lg shadow-md" />
                    <div class="absolute top-2 left-2 bg-primary text-white px-3 py-1 rounded-full text-xs font-medium">
                      鞋子
                    </div>
                  </div>
                  <h3 class="font-bold text-sm mb-1">${outfit.shoes.name}</h3>
                  <p class="text-xs text-subtle-light dark:text-subtle-dark mb-1">${outfit.shoes.color}</p>
                  <p class="text-xs text-primary font-medium">${outfit.shoes.brand}</p>
                </div>

                <!-- Accessories -->
                <div class="outfit-item">
                  ${outfit.accessories ? `
                    <div class="relative mb-3 group">
                      <img src="${outfit.accessories.image}" alt="${outfit.accessories.name}" 
                        class="w-full h-48 object-cover rounded-lg shadow-md" />
                      <div class="absolute top-2 left-2 bg-primary text-white px-3 py-1 rounded-full text-xs font-medium">
                        配件
                      </div>
                    </div>
                    <h3 class="font-bold text-sm mb-1">${outfit.accessories.name}</h3>
                    <p class="text-xs text-subtle-light dark:text-subtle-dark mb-1">${outfit.accessories.color}</p>
                    <p class="text-xs text-primary font-medium">${outfit.accessories.brand}</p>
                  ` : `
                    <div class="relative mb-3 border-2 border-dashed border-secondary-light dark:border-secondary-dark rounded-lg h-48 flex items-center justify-center">
                      <div class="text-center text-subtle-light dark:text-subtle-dark">
                        <span class="material-symbols-outlined text-4xl mb-2 block opacity-30">checkroom</span>
                        <p class="text-xs">暫無配件</p>
                      </div>
                    </div>
                    <p class="text-xs text-subtle-light dark:text-subtle-dark text-center">可自由搭配</p>
                  `}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 更新頁面顯示
      function updatePage() {
        outfitSlides.style.transform = `translateX(-${currentPage * 100}%)`;
        pageNumber.textContent = `${currentPage + 1} / ${totalPages}`;
        
        // Update dots
        pageDots.forEach((dot, index) => {
          if (index === currentPage) {
            dot.classList.remove('bg-subtle-light', 'dark:bg-subtle-dark');
            dot.classList.add('bg-primary');
          } else {
            dot.classList.remove('bg-primary');
            dot.classList.add('bg-subtle-light', 'dark:bg-subtle-dark');
          }
        });

        // Update buttons
        prevBtn.disabled = currentPage === 0;
        
        if (currentPage === totalPages - 1) {
          nextBtn.classList.add('hidden');
          shoppingBtn.classList.remove('hidden');
        } else {
          nextBtn.classList.remove('hidden');
          shoppingBtn.classList.add('hidden');
        }
      }

      // 初始化穿搭
      function initOutfits() {
        const generatedOutfits = generateOutfits();
        outfitSlides.innerHTML = generatedOutfits.map((outfit, index) => 
          createOutfitSlide(outfit, index)
        ).join('');
        updatePage();
      }

      // 事件監聽
      prevBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (currentPage > 0) {
          currentPage--;
          updatePage();
        }
      });

      nextBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (currentPage < totalPages - 1) {
          currentPage++;
          updatePage();
        }
      });

      shoppingBtn.addEventListener('click', (e) => {
        e.preventDefault();
        // 導向購物推薦頁面
        window.open('https://www.uniqlo.com/tw/', '_blank');
      });

      // 鍵盤導航
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && currentPage > 0) {
          currentPage--;
          updatePage();
        } else if (e.key === 'ArrowRight' && currentPage < totalPages - 1) {
          currentPage++;
          updatePage();
        }
      });

      // 頁面載入時初始化
      window.addEventListener('load', () => {
        initOutfits();
      });
    </script>

    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 0.3s ease-in;
      }
    </style>
</body>

</html>
