  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
    }
    .spinner {
      border: 4px solid rgba(216, 167, 177, 0.1);
      border-top: 4px solid #D8A7B1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
  <script>
    (function() {
      fetch('/login/status', {
        method: 'GET',
        credentials: 'include',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        }
      })
      .then(response => response.json())
      .then(data => {
        if (!data.authenticated) {
          const currentPath = window.location.pathname + window.location.search;
          window.location.href = `/login?next=${encodeURIComponent(currentPath)}`;
        } else {
          const userDisplay = document.getElementById('user-display');
          if (userDisplay && data.user?.username) {
            userDisplay.textContent = data.user.username;
            userDisplay.classList.remove('hidden');
          }
          const logoutSection = document.getElementById('logout-section');
          if (logoutSection) {
            logoutSection.classList.remove('hidden');
            logoutSection.classList.add('flex');
          }
        }
      })
      .catch(error => {
        console.error('Error checking login status:', error);
        const currentPath = window.location.pathname + window.location.search;
        window.location.href = `/login?next=${encodeURIComponent(currentPath)}`;
      });
    })();
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 從 URL 參數或 sessionStorage 獲取用戶輸入的需求
      const params = new URLSearchParams(window.location.search);
      const message = params.get('message') || sessionStorage.getItem('deals_message') || '推薦購買';
      
      if (message && message !== '推薦購買') {
        document.getElementById('subtitle').textContent = `根據「${message}」為你推薦購買清單`;
      }

      try {
        const response = await fetch('{{ url_for("recommendation.deals_api") }}', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            message: message
          })
        });

        if (!response.ok) {
          throw new Error(`API 請求失敗: ${response.status}`);
        }

        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error || '無法獲取推薦數據');
        }

        // 渲染推薦穿搭
        renderOutfit(data.outfit);
        
        // 渲染推薦單品
        renderProducts(data.products);

      } catch (error) {
        console.error('Deals API 錯誤:', error);
        document.getElementById('outfit-container').innerHTML = `
          <div class="text-center text-red-500 p-8">
            <p>無法加載推薦數據: ${error.message}</p>
          </div>
        `;
        document.getElementById('products-container').innerHTML = `
          <div class="text-center text-red-500 p-8">
            <p>無法加載推薦單品</p>
          </div>
        `;
      }
    });

    const CATEGORY_LABELS = {
      'top': '上衣',
      'bottom': '下身',
      'shoes': '鞋子',
      'accessories': '配件',
      'outerwear': '外套',
      'dress': '洋裝',
      'bags': '配件',
      'bag': '配件',
    };

    function formatCategory(cat) {
      if (!cat) return '未分類';
      const key = cat.toString().trim().toLowerCase();
      return CATEGORY_LABELS[key] || cat;
    }

    function renderOutfit(outfit) {
      const container = document.getElementById('outfit-container');
      if (!outfit || !outfit.items || outfit.items.length === 0) {
        container.innerHTML = '<p class="text-center text-subtle-light">暫無推薦穿搭</p>';
        return;
      }

      const itemsHTML = outfit.items.map(item => {
        const title = item._title || item.name || '未命名商品';
        const category = formatCategory(item._category || item.category || '未分類');
        const color = item._color || item.color || '未指定顏色';
        const image = item._image || item.image_url || 'https://via.placeholder.com/300?text=No+Image';
        const price = item.price ? `NT$ ${Math.round(item.price)}` : '詢價';

        return `
          <div class="outfit-item">
            <div class="relative mb-3">
              <img src="${image}" alt="${title}" class="w-full h-48 object-cover rounded-lg shadow-md" onerror="this.src='https://via.placeholder.com/300?text=No+Image'" />
              <div class="absolute top-2 left-2 bg-primary text-white px-3 py-1 rounded-full text-xs font-medium">${category}</div>
            </div>
            <h3 class="font-bold text-sm mb-1">${title}</h3>
            <p class="text-xs text-subtle-light dark:text-subtle-dark mb-1">${color}</p>
            <p class="text-xs text-primary font-medium">${price}</p>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="mb-8 bg-white dark:bg-secondary-dark rounded-xl shadow-lg overflow-hidden border border-secondary-light dark:border-secondary-dark">
          <div class="bg-gradient-to-r from-primary/20 to-primary/10 px-6 py-4">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-2xl font-bold text-text-light dark:text-text-dark mb-1">${outfit.title || '推薦穿搭'}</h2>
                <p class="text-sm text-subtle-light dark:text-subtle-dark">${outfit.description || outfit.occasion || '限時推薦穿搭'}</p>
              </div>
              <div class="flex items-center gap-2 bg-white dark:bg-secondary-dark px-4 py-2 rounded-full">
                <span class="material-symbols-outlined text-primary">star</span>
                <span class="font-bold text-lg">限時</span>
              </div>
            </div>
          </div>
          <div class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4">
            ${itemsHTML}
          </div>
        </div>
      `;
    }

    function renderProducts(products) {
      const container = document.getElementById('products-container');
      if (!products || products.length === 0) {
        container.innerHTML = '<p class="text-center text-subtle-light col-span-full">暫無推薦單品</p>';
        return;
      }

      const productsHTML = products.map(product => {
        const title = product._title || product.name || '未命名商品';
        const category = product._category || product.category || '未分類';
        const color = product._color || product.color || '';
        const image = product._image || product.image_url || 'https://via.placeholder.com/300?text=No+Image';
        const price = product.price ? `NT$ ${Math.round(product.price)}` : '詢價';
        const description = product._description || product.clothing_type || '限時推薦';

        return `
          <div class="bg-white dark:bg-secondary-dark rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
            <div class="relative overflow-hidden h-40 bg-secondary-light dark:bg-secondary-dark">
              <img src="${image}" alt="${title}" class="w-full h-full object-cover hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/300?text=No+Image'" />
              <div class="absolute top-2 left-2 bg-primary text-white px-2 py-1 rounded text-xs font-medium">${category}</div>
            </div>
            <div class="p-3">
              <h3 class="font-bold text-sm mb-1 line-clamp-2">${title}</h3>
              ${color ? `<p class="text-xs text-subtle-light dark:text-subtle-dark mb-1">${color}</p>` : ''}
              <p class="text-xs text-subtle-light dark:text-subtle-dark mb-2">${description}</p>
              <div class="flex items-center justify-between mb-3">
                <span class="text-primary font-bold text-sm">${price}</span>
              </div>
              <button onclick="addToCart('${title}', '${price}')" class="w-full bg-primary text-white py-2 rounded text-sm font-medium hover:bg-primary/90 transition-colors">
                加入購物車
              </button>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = productsHTML;
    }

    function addToCart(title, price) {
      alert(`已添加「${title}」(${price}) 到購物車`);
      // 這裡可以實現真實的購物車邏輯
    }
  </script>
